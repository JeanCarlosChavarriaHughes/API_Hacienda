name: Exakat

on:
  push:
    branches: [ "dev", "master", "v4.4", "feature/ossar-test" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '44 9 * * 0'

permissions:
  contents: read

jobs:
  exakat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker
        uses: docker/setup-buildx-action@v3
      - name: Enable QEMU for ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Run Exakat analysis
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v ${{ github.workspace }}/.exakat:/usr/src/exakat/projects \
            exakat/exakat \
            project -p crlibre_api_hacienda_php -R /project

          docker run --rm \
            -v ${{ github.workspace }}:/project \
            -v ${{ github.workspace }}/.exakat:/usr/src/exakat/projects \
            exakat/exakat \
            report -p crlibre_api_hacienda_php -format Text