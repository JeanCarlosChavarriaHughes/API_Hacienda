name: Exakat

on:
  push:
    branches: [ "dev", "master", "v4.4", "feature/ossar-test" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: '44 9 * * 0'

permissions:
  contents: read

jobs:
  exakat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Docker
        uses: docker/setup-buildx-action@v3
      - name: Run Exakat analysis
        run: |
          docker run --platform linux/amd64 --pull always --rm -v ${{ github.workspace }}:/project exakat/exakat exakat project -p myproject -R /project
          docker run --platform linux/amd64 --pull always --rm -v ${{ github.workspace }}:/project exakat/exakat exakat report -p myproject -format Text